name: Web Admin CI

on:
  push:
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'camera-ai/src/**'
      - 'camera-ai/tests/**'
      - '.github/workflows/web-ci.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'camera-ai/src/**'
      - 'camera-ai/tests/**'
      - '.github/workflows/web-ci.yml'

jobs:
  backend:
    # Flask API on camera-ai's FakeFirestore (no Firebase credentials), plus the web <-> edge
    # contract test that runs the real camera-ai EdgeRuntime on the same fake database.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        # Flask stack pinned as in backend/requirements.txt; numpy, opencv and tzdata for camera-ai, as in camera-ai-ci.yml.
        run: >-
          python -m pip install --upgrade pip pytest Flask==3.1.3 flask-cors==6.0.5 requests==2.34.2
          numpy opencv-python-headless tzdata
      - name: Backend and contract tests
        run: python -m pytest backend/tests -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Stub the gitignored Firebase config
        run: |
          cat > src/firebase.js <<'EOF'
          import { initializeApp } from "firebase/app";
          import { getAuth, GoogleAuthProvider } from "firebase/auth";

          const app = initializeApp({ apiKey: "ci", authDomain: "ci.firebaseapp.com", projectId: "ci" });

          export const auth = getAuth(app);
          export const googleProvider = new GoogleAuthProvider();
          EOF
      - name: Build
        # No lint step yet: the existing frontend code has 42 eslint errors to fix first.
        run: npm run build
